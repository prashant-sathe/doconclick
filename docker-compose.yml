version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: doconclick_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: doconclick
      POSTGRES_PASSWORD: doconclick_secret
      POSTGRES_DB: doconclick_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doconclick -d doconclick_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
