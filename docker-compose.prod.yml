name: doconclick-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-off job: applies the Prisma schema (`prisma db push`, matching the
  # project's existing no-migrations convention) before the app starts.
  # Uses the `prisma` stage (has the CLI + generated client, but skips
  # `npm run build`) rather than `builder` — this job never touches the
  # compiled app, and building it would otherwise run `next build` twice
  # in parallel alongside the `app` target's own build.
  migrate:
    build:
      context: .
      target: prisma
    command: ["npx", "prisma", "db", "push", "--accept-data-loss"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy

  # One-off job: uploads pre-existing files from the legacy `uploads` volume
  # to S3 and rewrites their DB URLs. Not part of the normal startup graph —
  # run manually once after setting the AWS_* vars in .env.production:
  #   docker compose -f docker-compose.prod.yml run --rm migrate-uploads-to-s3
  # Safe to delete this service (and the `uploads` volume) once confirmed.
  migrate-uploads-to-s3:
    build:
      context: .
      target: prisma
    command: ["npx", "tsx", "prisma/migrate-uploads-to-s3.ts"]
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads:
  letsencrypt:
  certbot-www:
