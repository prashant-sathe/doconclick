events {
  worker_connections 1024;
}

http {
  client_max_body_size 20m;

  server {
    listen 80;
    server_name _;

    # Runtime-uploaded files (prescriptions, doctor docs) are written directly
    # to this volume by the app. Serve them straight from disk instead of
    # through Next.js: the standalone server only serves the `public/`
    # snapshot taken at boot, so files written after startup 404 there.
    location /uploads/ {
      alias /var/www/uploads/;
    }

    location / {
      proxy_pass http://app:3000;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      # Next.js streams responses (Suspense, RSC) — buffering breaks that.
      proxy_buffering off;
      proxy_read_timeout 60s;
    }
  }
}
