events {
  worker_connections 1024;
}

http {
  client_max_body_size 20m;

  server {
    listen 80;
    server_name doconclick.co.in www.doconclick.co.in;

    # Needed so `certbot renew` (webroot mode) can keep working without
    # taking nginx down. Harmless if unused.
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # Canonicalise www -> apex so there is exactly one origin. Without this,
  # www. visitors get a www redirect_uri that Google's OAuth client doesn't
  # recognise (Error 400: redirect_uri_mismatch), among other host-split bugs.
  server {
    listen 443 ssl;
    server_name www.doconclick.co.in;

    ssl_certificate     /etc/letsencrypt/live/doconclick.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doconclick.co.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      return 301 https://doconclick.co.in$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name doconclick.co.in;

    ssl_certificate     /etc/letsencrypt/live/doconclick.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doconclick.co.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://app:3000;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      # Next.js streams responses (Suspense, RSC) — buffering breaks that.
      proxy_buffering off;
      proxy_read_timeout 60s;
    }
  }
}
